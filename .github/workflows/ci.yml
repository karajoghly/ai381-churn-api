name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Fast code checks on every PR. Training, the model gate, the image and the
# Azure deployment live in train-deploy.yml.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint-test
    runs-on: ubuntu-latest
    steps:
      # Every third-party action is pinned to a full commit SHA, not a tag:
      # a tag can be moved to malicious code, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Check base image is pinned by digest
        run: grep -qE '^ARG BASE_IMAGE=[^@]+@sha256:[a-f0-9]{64}$' Dockerfile

      - name: Train model
        run: python -m src.train.train

      - name: Test (pytest)
        run: pytest
